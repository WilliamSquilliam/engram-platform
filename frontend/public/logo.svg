<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Engram Smart CAG">
  <defs>
    <linearGradient id="ev-tile" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c83f4"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="ev-sheen" x1="32" y1="3" x2="32" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- rounded app tile: indigo gradient + soft top sheen + hairline edge -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#ev-tile)"/>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#ev-sheen)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="16.25" stroke="#ffffff" stroke-opacity=".16"/>
  <!-- forward-slanted E: top & bottom arms taper to sharp points (top-right / bottom-right) -->
  <g fill="#ffffff" transform="translate(5,0) skewX(-12)">
    <rect x="21" y="15"   width="7"  height="34" rx="1.5"/>
    <path d="M21 15 L48 15 L38 22 L21 22 Z"/>
    <rect x="21" y="28.5" width="16" height="7" rx="1.5"/>
    <path d="M21 42 L38 42 L48 49 L21 49 Z"/>
  </g>
</svg>
